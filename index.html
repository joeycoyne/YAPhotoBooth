<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>YAPhotoBooth</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>YAPhotoBooth</h1>
        <p class="subtitle">4-photo booth test · v0.3</p>
      </div>
      <span id="statusBadge" class="status-badge">Starting…</span>
    </header>

    <section class="booth-stage">
      <section class="preview-panel" aria-label="Camera preview">
        <video id="preview" autoplay playsinline muted></video>

        <div id="previewMessage" class="preview-message">
          <div>
            <h2>Camera not started</h2>
            <p>Choose a camera below.</p>
          </div>
        </div>

        <div id="countdownOverlay" class="countdown-overlay hidden" aria-live="assertive">
          <div id="countdownLabel" class="countdown-label">Get ready!</div>
          <div id="countdownNumber" class="countdown-number">4</div>
        </div>

        <div id="flashOverlay" class="flash-overlay" aria-hidden="true"></div>
      </section>

      <aside class="recent-panel" aria-label="Most recent slide">
        <div class="recent-heading">
          <h2>Most Recent Slide</h2>
          <p>Last 4-photo session</p>
        </div>

        <div id="recentSession" class="recent-session">
          <div class="recent-photo empty"><span>1</span></div>
          <div class="recent-photo empty"><span>2</span></div>
          <div class="recent-photo empty"><span>3</span></div>
          <div class="recent-photo empty"><span>4</span></div>
        </div>

        <p id="recentEmptyText" class="recent-empty-text">No photo session yet</p>
      </aside>
    </section>

    <section class="booth-toolbar" aria-label="Photo booth effects">
      <div class="effect-strip">
        <button class="effect-chip selected" type="button" data-effect="normal">Normal</button>
        <button class="effect-chip" type="button" data-effect="bw">B&amp;W</button>
        <button class="effect-chip" type="button" data-effect="pop">Pop</button>
        <button class="effect-chip" type="button" data-effect="warm">Warm</button>
        <button class="effect-chip" type="button" data-effect="sunglasses">😎</button>
        <button class="effect-chip" type="button" data-effect="crown">👑</button>
        <button class="effect-chip birthday-chip" type="button" data-effect="gianna">Gianna's 11th!</button>
      </div>

      <button id="takePhotosButton" class="take-button" type="button" disabled>
        Take Photos
      </button>
    </section>

    <section class="controls">
      <label for="cameraSelect">Camera</label>
      <select id="cameraSelect" aria-label="Choose camera"></select>

      <div class="button-row">
        <button id="useCameraButton" class="primary-button" type="button">
          Use this camera
        </button>
        <button id="refreshButton" class="secondary-button" type="button">
          Refresh cameras
        </button>
      </div>

      <p id="detailText" class="detail-text">
        Camera permission is required before Chrome can show camera names.
      </p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
